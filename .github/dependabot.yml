version: 2

# The toolkit itself is PowerShell with no package manager. GitHub Actions is
# disabled and has no workflows left, so this tracks nothing until one returns.
# Grouped so routine bumps arrive as one PR rather than one per action.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

# ============================================================
# Win11 Gaming Toolkit — CI
# ============================================================
# Runs on every push to main / CC/** and on pull requests to main.
#
# One gate, two runners. Both jobs use pwsh (PowerShell 7), not
# Windows PowerShell 5.1, and both invoke tools/Invoke-ToolkitGate.ps1:
#   - PSScriptAnalyzer with .psscriptanalyzer.psd1
#   - Pester v5 (tests/**/*.Tests.ps1)
#
# ubuntu-latest and windows-latest run that same suite. The tests are
# static / AST. No test is tagged for a Windows-only host, and
# tests/integration/ is not part of this workflow. PS 5.1 syntax is
# checked by tests/invariants/ps51-load-path.Tests.ps1 on these pwsh
# jobs, not by a Windows PowerShell 5.1 runner.
#
# Analyzer and Pester failures print in the job log. The committed
# .psscriptanalyzer-baseline.json snapshot is not a gate output.
# ============================================================
name: ci

on:
  push:
    branches: [main, "CC/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: gate (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AcceptLicense
          Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0 -AcceptLicense

      - name: Run quality gate
        shell: pwsh
        run: pwsh -File tools/Invoke-ToolkitGate.ps1

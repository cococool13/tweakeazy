# ============================================================
# Win11 Gaming Toolkit — CI
# ============================================================
# Runs on every push + PR:
#   - PSScriptAnalyzer with project ruleset (.psscriptanalyzer.psd1)
#   - Pester v5 test suite (tests/**/*.Tests.ps1)
#
# Two job matrix:
#   - ubuntu (parser-only, static analysis — fastest feedback)
#   - windows-latest (runtime-capable; runs WindowsOnly-tagged tests)
#
# Both jobs use the same tools/Invoke-ToolkitGate.ps1 entrypoint so
# devs can reproduce CI failures locally.
# ============================================================
name: ci

on:
  push:
    branches: [main, "CC/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: gate (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AcceptLicense
          Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0 -AcceptLicense

      - name: Run quality gate
        shell: pwsh
        run: pwsh -File tools/Invoke-ToolkitGate.ps1

      - name: Upload analyzer output (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: psscriptanalyzer-${{ matrix.os }}
          path: |
            .psscriptanalyzer-baseline.json
